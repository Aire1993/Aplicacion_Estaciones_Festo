  });

  window.addEventListener("resize", function () {
    var doc = panel.querySelector(".doc");
    if (doc) sizeDoc(doc);
  });

  // ---------------------------------------------------------------------------
  // Grafcet: dibuix (SVG) i explicació de cada etapa i transició
  // ---------------------------------------------------------------------------

  var GF_LEVELS = [
    { key: "fn", label: "Funcional", name: "funcional", hint: "en paraules" },
    { key: "tag", label: "Tecnològic", name: "tecnològic", hint: "etiquetes dels esquemes" },
    { key: "plc", label: "PLC", name: "PLC", hint: "adreces d'entrades i sortides" }
  ];
  // Mides del dibuix (px): etapa, distància entre files, marge, separació entre retorns.
  var GF = { step: 44, row: 124, pad: 20, lane: 14, font: 13, labelW: 230 };

  var gf = null;          // grafcet de l'estació que es mostra al panell
  var gfChart = 2;        // grafcet parcial que es mostra (per defecte, Producció)
  var gfLevel = "fn";     // nivell de descripció
  var gfPinned = "";      // element seleccionat amb un clic
  var gfCtx = null, gfFont = "";

  function gfTextWidth(s, weight, italic) {
    if (!gfCtx) {
      gfCtx = document.createElement("canvas").getContext("2d");
      gfFont = getComputedStyle(document.body).fontFamily;
    }
    gfCtx.font = (italic ? "italic " : "") + (weight || 400) + " " + GF.font + "px " + gfFont;
    return gfCtx.measureText(s).width;
  }

  function gfAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }
  function gfTokens(c) { return c.match(/\d+(?:\.\d+)?m?s\/|[A-Za-z_]\w*|[\/^*+()]/g) || []; }
  function gfIsStepVar(id) { return /^X\d+$/.test(id); }
  function gfVarsOf(c) {
    return gfTokens(c).filter(function (t) { return /^[A-Za-z_]/.test(t); });
  }
  function gfLevelName(key) {
    return GF_LEVELS.filter(function (l) { return l.key === key; })[0].name;
  }

  // Etapa n de qualsevol dels grafcets parcials.
  function gfFindStep(n) {
    for (var i = 0; i < gf.charts.length; i++) {
      var s = gf.charts[i].steps.filter(function (x) { return x.n === n; })[0];
      if (s) return { chart: gf.charts[i], step: s };
    }
    return null;
  }

  // Parts d'una condició al nivell PLC o Tecnològic: [{ t: text, neg: negat }]
  function gfCondParts(c, level) {
    var parts = [], neg = false, edge = "";
    gfTokens(c).forEach(function (t) {
      if (t === "/") neg = true;
      else if (t === "^") edge = "↑";
      else if (t === "*") parts.push({ t: " · " });
      else if (t === "+") parts.push({ t: " + " });
      else if (t === "(" || t === ")" || /^\d/.test(t)) parts.push({ t: t });
      else {
        if (edge) parts.push({ t: edge });
        parts.push({ t: gfIsStepVar(t) ? t : gf.vars[t][level], neg: neg });
        neg = false;
        edge = "";
      }
    });
    return parts;
  }

  function gfLabelParts(t, level) {
    return level === "fn" ? [{ t: t.fn }] : gfCondParts(t.c, level);
  }

  // Parteix el text en línies d'una amplada màxima (les parts negades no es parteixen).
  function gfWrap(parts, maxW) {
    var lines = [[]], w = 0, widths = [0];
    parts.forEach(function (p) {
      var bits = p.neg ? [p.t] : p.t.match(/\S+\s*|\s+/g) || [];
      bits.forEach(function (b) {
        var line = lines[lines.length - 1];
        var bw = gfTextWidth(b);
        if (w + bw > maxW && line.length) {
          b = b.replace(/^\s+/, "");
          if (!b) return;
          bw = gfTextWidth(b);
          lines.push(line = []);
          widths.push(w = 0);
        }
        var last = line[line.length - 1];
        if (last && !!last.neg === !!p.neg && !p.neg) last.t += b;
        else line.push({ t: b, neg: p.neg });
        w += bw;
        widths[widths.length - 1] = w;
      });
    });
    return { lines: lines, w: Math.ceil(Math.max.apply(null, widths)) };
  }

  function gfActText(a, level) {
    if (a.force) return a.force + "{" + a.to + "}";
    var v = gf.vars[a.v];
    return level === "fn" ? v.fn : level === "tag" ? (v.tagAct || v.tag) : v.plc;
  }

  // --- Posició de cada element ---

  function gfLayout(chart, level) {
    var S = GF.step, steps = {}, cols = [], out = {}, maxRow = 0;
    chart.steps.forEach(function (s) {
      var acts = (s.act || []).map(function (a) {
        var txt = gfActText(a, level);
        var w = Math.ceil(gfTextWidth(txt, a.force ? 600 : 400)) + 22;
        var cond = !a.cond ? [] : level === "fn" ? [{ t: a.condFn }] : gfCondParts(a.cond, level);
        var cw = Math.ceil(gfTextWidth(cond.map(function (p) { return p.t; }).join("")));
        return { a: a, txt: txt, w: Math.max(w, cw + 12), cond: cond };
      });
      var col = s.col || 0;
      var ext = acts.length
        ? S / 2 + 22 + acts.reduce(function (sum, x) { return sum + x.w; }, 0)
        : S / 2 + 14 + Math.ceil(gfTextWidth('"' + s.name + '"', 400, true));
      steps[s.n] = { s: s, col: col, row: s.row, acts: acts };
      cols[col] = Math.max(cols[col] || 0, ext);
      out[s.n] = [];
      maxRow = Math.max(maxRow, s.row);
    });
    var trans = chart.trans.map(function (t, i) {
      var a = steps[t.from], b = steps[t.to];
      var loop = b.row <= a.row;
      var lab = gfWrap(gfLabelParts(t, level), level === "fn" ? GF.labelW : 320);
      var col = loop ? a.col : b.col;
      cols[col] = Math.max(cols[col] || 0, 19 + lab.w);
      var tr = { t: t, i: i, a: a, b: b, loop: loop, col: col, lab: lab };
      out[t.from].push(tr);
      return tr;
    });
    // Retorns cap amunt: per l'esquerra si surten de la primera columna, si no per la dreta.
    var left = 0, right = 0, entries = {};
    trans.forEach(function (tr) {
      if (!tr.loop) return;
      tr.side = tr.a.col === 0 ? "left" : "right";
      tr.lane = tr.side === "left" ? left++ : right++;
      tr.entry = entries[tr.t.to] = (entries[tr.t.to] || 0) + 1;
    });
    var maxEntry = 0;
    Object.keys(entries).forEach(function (k) { maxEntry = Math.max(maxEntry, entries[k]); });
    var colX = [];
    for (var c = 0; c < cols.length; c++) {
      colX[c] = c === 0
        ? GF.pad + 6 + (left ? (left - 1) * GF.lane + 18 : 0) + S / 2
        : colX[c - 1] + cols[c - 1] + 36 + S / 2;
    }
    var rightEdge = colX[cols.length - 1] + cols[cols.length - 1];
    var top = GF.pad + 30 + 8 * Math.max(0, maxEntry - 1);
    // Més espai entre files si alguna condició ocupa més de dues línies.
    var maxLines = Math.max.apply(null, trans.map(function (tr) { return tr.lab.lines.length; }));
    var rowH = GF.row + 16 * Math.max(0, maxLines - 2);
    Object.keys(steps).forEach(function (n) {
      var st = steps[n];
      st.x = colX[st.col];
      st.top = top + st.row * rowH;
      st.bottom = st.top + S;
      st.cy = st.top + S / 2;
    });
    var maxY = top + maxRow * rowH + S;
    trans.forEach(function (tr) {
      tr.x = colX[tr.col];
      tr.y = tr.a.bottom + 34;
      tr.div = out[tr.t.from].length > 1;
      maxY = Math.max(maxY, tr.y + tr.lab.lines.length * 8 + 4);
      if (tr.loop) {
        // Per sota del text de la condició.
        tr.yLoop = tr.y + Math.max(18, tr.lab.lines.length * 8 + 14);
        tr.laneX = tr.side === "left"
          ? colX[0] - S / 2 - 18 - tr.lane * GF.lane
          : rightEdge + 18 + tr.lane * GF.lane;
        tr.yIn = tr.b.top - 14 - 8 * (tr.entry - 1);
        maxY = Math.max(maxY, tr.yLoop);
      }
    });
    var w = (right ? rightEdge + 18 + (right - 1) * GF.lane + 6 : rightEdge) + GF.pad;
    return { steps: steps, trans: trans, out: out, w: Math.ceil(w), h: Math.ceil(maxY + GF.pad) };
  }

  // --- Dibuix ---

  function gfTspans(lines, x, y) {
    var lh = 16, y0 = y - (lines.length - 1) * lh / 2 + 4.5;
    return lines.map(function (line, i) {
      return '<tspan x="' + x + '" y="' + (y0 + i * lh) + '">' + line.map(function (p) {
        return p.neg ? '<tspan text-decoration="overline">' + escapeHtml(p.t) + "</tspan>" : escapeHtml(p.t);
      }).join("") + "</tspan>";
    }).join("");
  }

  function gfLine(x1, y1, x2, y2) {
    return '<line class="ln" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>';
  }
  function gfPath(d, cls) { return '<path class="' + (cls || "ln") + '" d="' + d + '"/>'; }

  // Condició llegida en veu alta (per als lectors de pantalla).
  function gfCondSpeech(c, level) {
    var words = { "*": " i ", "+": " o ", "^": "flanc de pujada de ", "/": "no ", "(": "(", ")": ")" };
    return gfTokens(c).map(function (t) {
      if (words[t]) return words[t];
      if (/^\d/.test(t)) return t.slice(0, -1) + " de ";
      return gfIsStepVar(t) ? t : gf.vars[t][level];
    }).join("");
  }

  function gfStepLabel(s, chart, level) {
    var acts = (s.act || []).map(function (a) {
      if (a.force) return gfActText(a, level) + ": " + gfForceText(a).replace(/\.$/, "");
      return gfActText(a, level) + (a.cond ? " només si " + (level === "fn" ? a.condFn : gfCondSpeech(a.cond, level)) : "");
    });
    return "Etapa " + s.n + (s.init ? " (inicial)" : "") + ", " + s.name + (acts.length ? ". Accions: " + acts.join("; ") : "");
  }

  function gfForceText(a) {
    var target = gf.charts.filter(function (c) { return c.key === a.force; })[0];
    var name = "el grafcet de " + target.name.toLowerCase();
    var init = target.steps.filter(function (x) { return x.init; }).map(function (x) { return x.n; }).join(", ");
    return a.to === "INIT" ? "Força " + name + " a la situació inicial (etapa " + init + ")." :
      a.to ? "Força " + name + " a l'etapa " + a.to + "." :
      "Deixa " + name + " sense cap etapa activa.";
  }

  function gfSvg(chart, level, interactive) {
    var L = gfLayout(chart, level), S = GF.step, o = [];
    // Enllaços i transicions
    Object.keys(L.out).forEach(function (n) {
      var list = L.out[n], a = L.steps[n];
      if (!list.length) return;
      if (list.length > 1) {
        // Divergència en O: una sola línia horitzontal i una transició a cada branca.
        var yDiv = a.bottom + 12, xs = list.map(function (tr) { return tr.x; }).concat(a.x);
        o.push(gfLine(a.x, a.bottom, a.x, yDiv));
        o.push(gfLine(Math.min.apply(null, xs), yDiv, Math.max.apply(null, xs), yDiv));
        list.forEach(function (tr) { o.push(gfLine(tr.x, yDiv, tr.x, tr.y)); });
      } else {
        o.push(gfLine(a.x, a.bottom, a.x, list[0].y));
      }
    });
    L.trans.forEach(function (tr) {
      var b = tr.b;
      if (!tr.loop) {
        o.push(gfLine(tr.x, tr.y, tr.x, b.top));
      } else {
        // Retorn cap amunt, amb fletxa a la línia que puja.
        o.push(gfPath("M" + tr.x + " " + tr.y + "V" + tr.yLoop + "H" + tr.laneX + "V" + tr.yIn + "H" + b.x + "V" + b.top));
        var ym = Math.round((tr.yLoop + tr.yIn) / 2);
        o.push(gfPath("M" + (tr.laneX - 4.5) + " " + (ym + 4) + "L" + tr.laneX + " " + (ym - 5) + "L" + (tr.laneX + 4.5) + " " + (ym + 4) + "Z", "arw"));
      }
    });
    // Etapes i transicions en l'ordre de lectura (també és l'ordre del tabulador).
    var trG = L.trans.map(function (tr) {
      var t = tr.t, lx = tr.x + 19, h = tr.lab.lines.length * 16 + 8;
      var label = "Transició de l'etapa " + t.from + " a la " + t.to + ": " +
        (level === "fn" ? t.fn : gfCondSpeech(t.c, level) + ". " + t.fn);
      return '<g class="gf-tr" data-el="t' + tr.i + '" data-vars="' + gfVarsOf(t.c).join(" ") + '"' +
        (interactive ? ' tabindex="0" role="button" aria-pressed="false" aria-label="' + gfAttr(label) + '"' : "") + ">" +
        '<rect class="hit" x="' + (tr.x - 14) + '" y="' + (tr.y - h / 2) + '" width="' + (tr.lab.w + 33) + '" height="' + h + '"/>' +
        '<line class="bar" x1="' + (tr.x - 11) + '" y1="' + tr.y + '" x2="' + (tr.x + 11) + '" y2="' + tr.y + '"/>' +
        '<text class="txt">' + gfTspans(tr.lab.lines, lx, tr.y) + "</text></g>";
    });
    chart.steps.forEach(function (s) {
      var st = L.steps[s.n], x0 = st.x - S / 2;
      var vars = [];
      (s.act || []).forEach(function (a) {
        if (a.v) vars.push(a.v);
        if (a.cond) vars = vars.concat(gfVarsOf(a.cond));
      });
      var g = '<g class="gf-step" data-el="s' + s.n + '" data-vars="' + vars.join(" ") + '"' +
        (interactive ? ' tabindex="0" role="button" aria-pressed="false" aria-label="' + gfAttr(gfStepLabel(s, chart, level)) + '"' : "") + ">" +
        '<rect class="box" x="' + x0 + '" y="' + st.top + '" width="' + S + '" height="' + S + '"/>' +
        (s.init ? '<rect class="box in" x="' + (x0 + 4) + '" y="' + (st.top + 4) + '" width="' + (S - 8) + '" height="' + (S - 8) + '"/>' : "") +
        '<text class="num" x="' + st.x + '" y="' + (st.cy + 5) + '">' + s.n + "</text>";
      if (st.acts.length) {
        var x = st.x + S / 2 + 22, y = st.cy - 15;
        g += gfLine(st.x + S / 2, st.cy, x, st.cy);
        st.acts.forEach(function (ac) {
          g += '<rect class="box act" x="' + x + '" y="' + y + '" width="' + ac.w + '" height="30"/>';
          if (ac.a.force) {
            // Ordre de forçat: requadre doble.
            g += '<rect class="box in" x="' + (x + 3) + '" y="' + (y + 3) + '" width="' + (ac.w - 6) + '" height="24"/>';
          }
          if (ac.cond.length) {
            // Acció condicionada: la condició va a sobre, amb una línia curta.
            g += gfLine(x + ac.w / 2, y, x + ac.w / 2, y - 10) +
              '<text class="txt" text-anchor="middle" x="' + (x + ac.w / 2) + '" y="' + (y - 14) + '">' + ac.cond.map(function (p) {
                return p.neg ? '<tspan text-decoration="overline">' + escapeHtml(p.t) + "</tspan>" : escapeHtml(p.t);
              }).join("") + "</text>";
          }
          g += '<text class="txt' + (ac.a.force ? " frc" : "") + '" x="' + (x + 11) + '" y="' + (st.cy + 4.5) + '">' + escapeHtml(ac.txt) + "</text>";
          x += ac.w;
        });
      } else {
        // Comentari (entre cometes, com diu la norma).
        g += '<text class="cmt" x="' + (st.x + S / 2 + 14) + '" y="' + (st.cy + 4.5) + '">"' + escapeHtml(s.name) + '"</text>';
      }
      o.push(g + "</g>");
      L.out[s.n].forEach(function (tr) { o.push(trG[tr.i]); });
    });
    return {
      w: L.w, h: L.h,
      html: '<svg class="gf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + L.w + " " + L.h + '" width="' + L.w + '" height="' + L.h + '"' +
        ' data-w="' + L.w + '" data-h="' + L.h + '" role="group" aria-label="' + gfAttr("Grafcet " + chart.key + ", " + chart.name) + '">' +
        o.join("") + "</svg>"
    };
  }

  // --- Panell ---

  function renderGrafcet(data) {
    gf = data;
    gfPinned = "";
    var html = '<div class="gf"><p class="gf-intro">Grafcet de l\'estació segons la norma IEC 60848, dividit en tres grafcets ' +
      "jerarquitzats: <b>Seguretat</b> mana sobre els altres dos, <b>Conducció</b> gestiona el panell i els modes de marxa, " +
      "i <b>Producció</b> fa la seqüència de l'estació. Els superiors manen sobre els inferiors amb ordres de forçat (requadre doble, p. ex. GP{INIT}).</p>" +
      '<div class="gf-bar"><div class="gf-tabs" role="group" aria-label="Grafcets parcials">';
    data.charts.forEach(function (c, i) {
      if (i) html += '<span class="gf-arrow" aria-hidden="true">força <span>&rsaquo;</span></span>';
      html += '<button type="button" class="gf-tab" data-chart="' + i + '" aria-pressed="false"><b>' + c.key + "</b> " + escapeHtml(c.name) + "</button>";
    });
    html += '</div><div class="gf-levels" role="group" aria-label="Nivell de descripció">';
    GF_LEVELS.forEach(function (l) {
      html += '<button type="button" class="gf-level" data-level="' + l.key + '" aria-pressed="false" title="' + gfAttr(l.label + ": " + l.hint) + '">' + l.label + "</button>";
    });
    html += "</div></div>" +
      '<div class="gf-main"><figure class="gf-figure"><figcaption class="gf-head"><span class="gf-title"></span>' +
      '<button type="button" class="gf-zoom" aria-label="Amplia el grafcet"><svg viewBox="0 0 20 20" aria-hidden="true">' +
      '<path d="M12 3h5v5M8 17H3v-5M17 3l-6 6M3 17l6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Amplia</button></figcaption>' +
      '<p class="gf-wide-hint">Llisca cap al costat per veure tot el grafcet.</p><div class="gf-scroll"></div></figure>' +
      '<div class="gf-side"><p class="gf-about"></p><div class="gf-info" aria-live="polite"></div><div class="gf-vars"></div></div></div>' +
      '<p class="comp-source">Font: <a href="' + data.source.url + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(data.source.label) +
      "</a> (seqüència, taula d'assignació, esquemes i programa de PLC). La seguretat i la conducció segueixen l'estructura GEMMA habitual.</p></div>";
    return html;
  }

  function drawGrafcet() {
    var chart = gf.charts[gfChart];
    Array.prototype.forEach.call(panel.querySelectorAll(".gf-tab"), function (b) {
      b.setAttribute("aria-pressed", +b.getAttribute("data-chart") === gfChart ? "true" : "false");
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".gf-level"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-level") === gfLevel ? "true" : "false");
    });
    panel.querySelector(".gf-title").innerHTML = '<span class="comp-kicker">' + chart.key + "</span> " + escapeHtml(chart.name) +
      ' <span class="gf-lv">· nivell ' + gfLevelName(gfLevel) + "</span>";
    panel.querySelector(".gf-scroll").innerHTML = gfSvg(chart, gfLevel, true).html;
    gfCheckWide();
    panel.querySelector(".gf-about").textContent = chart.about;
    panel.querySelector(".gf-vars").innerHTML = gfVarsTable(chart);
    gfSetPinned(gfPinned);
  }

  // Si el grafcet no hi cap d'amplada (mòbils), s'avisa que es pot lliscar.
  function gfCheckWide() {
    var sc = panel.querySelector(".gf-scroll");
    if (sc) sc.parentNode.classList.toggle("is-wide", sc.scrollWidth > sc.clientWidth + 2);
  }
  window.addEventListener("resize", function () { if (gf) gfCheckWide(); });

  // Senyals que fa servir un grafcet parcial, en l'ordre de la taula.
  function gfChartVars(chart) {
    var list = [];
    function add(id) { if (list.indexOf(id) < 0) list.push(id); }
    chart.steps.forEach(function (s) {
      (s.act || []).forEach(function (a) {
        if (a.v) add(a.v);
        if (a.cond) gfVarsOf(a.cond).forEach(add);
      });
    });
    chart.trans.forEach(function (t) { gfVarsOf(t.c).forEach(add); });
    function group(id) {
      if (gfIsStepVar(id)) return 2;
      var p = gf.vars[id].plc;
      return /^I/.test(p) ? 0 : /^Q/.test(p) ? 1 : 3;
    }
    return list.sort(function (a, b) {
      var ga = group(a), gb = group(b);
      if (ga !== gb) return ga - gb;
      var pa = gfIsStepVar(a) ? a : gf.vars[a].plc, pb = gfIsStepVar(b) ? b : gf.vars[b].plc;
      return pa < pb ? -1 : pa > pb ? 1 : 0;
    }).map(function (id) { return { id: id, group: group(id) }; });
  }

  function gfVarsTable(chart) {
    var names = ["Entrades", "Sortides", "Etapes d'altres grafcets", "Altres"];
    var html = '<table class="gf-table lv-' + gfLevel + '"><caption>Senyals d\'aquest grafcet</caption>' +
      '<thead><tr><th scope="col" class="c-plc">PLC</th><th scope="col" class="c-tag">Etiqueta</th><th scope="col" class="c-fn">Descripció</th></tr></thead>';
    var last = -1;
    gfChartVars(chart).forEach(function (r) {
      if (r.group !== last) {
        html += (last < 0 ? "" : "</tbody>") + '<tbody><tr class="gf-group"><th colspan="3" scope="rowgroup">' + names[r.group] + "</th></tr>";
        last = r.group;
      }
      var plc, tag, desc;
      if (gfIsStepVar(r.id)) {
        var f = gfFindStep(+r.id.slice(1));
        plc = r.id;
        tag = f ? f.chart.key : "";
        desc = f ? "Etapa " + f.step.n + " de " + f.chart.key + " activa (" + f.step.name.toLowerCase() + ")" : "";
      } else {
        var v = gf.vars[r.id];
        plc = v.plc; tag = v.tag; desc = v.desc;
      }
      html += '<tr data-var="' + r.id + '"><th scope="row" class="c-plc">' + escapeHtml(plc) + '</th><td class="c-tag">' + escapeHtml(tag) +
        '</td><td class="c-fn">' + escapeHtml(desc) + "</td></tr>";
    });
    html += "</tbody></table>";
    if (chart.key === "GP" && gf.unused) html += '<p class="gf-unused">No s\'utilitzen en aquesta seqüència: ' + escapeHtml(gf.unused) + ".</p>";
    return html;
  }

  function gfCondHtml(c, level) {
    return gfCondParts(c, level).map(function (p) {
      return p.neg ? '<span class="gf-not">' + escapeHtml(p.t) + "</span>" : escapeHtml(p.t);
    }).join("");
  }

  function gfActHtml(a) {
    if (a.force) return "<li><b>" + escapeHtml(gfActText(a, "plc")) + "</b> · " + escapeHtml(gfForceText(a)) + "</li>";
    var v = gf.vars[a.v];
    var html = "<li><b>" + escapeHtml(v.fn) + "</b> · " + escapeHtml(v.tagAct || v.tag) + " · " + escapeHtml(v.plc);
    if (a.cond) {
      html += '<span class="gf-note">Acció condicionada: només mentre es compleix ' + gfCondHtml(a.cond, "plc") +
        " (" + escapeHtml(a.condFn) + ").</span>";
    }
    return html + "</li>";
  }

  function gfShowInfo(id) {
    var box = panel.querySelector(".gf-info");
    if (!box) return;
    // No es torna a escriure (ni a anunciar) si ja mostra el mateix.
    var key = gfChart + ":" + (id || "");
    if (box.getAttribute("data-shown") === key) return;
    box.setAttribute("data-shown", key);
    var chart = gf.charts[gfChart], html;
    var s = id && id.charAt(0) === "s" ? chart.steps.filter(function (x) { return "s" + x.n === id; })[0] : null;
    var t = id && id.charAt(0) === "t" ? chart.trans[+id.slice(1)] : null;
    if (s) {
      html = '<span class="comp-kicker">' + chart.key + " · Etapa " + s.n + (s.init ? " (inicial)" : "") + "</span>" +
        "<h4>" + escapeHtml(s.name) + "</h4>" +
        (s.act && s.act.length ? '<p class="gf-sub">Accions</p><ul class="gf-acts">' + s.act.map(gfActHtml).join("") + "</ul>"
          : '<p class="gf-sub">Sense accions</p>') +
        (s.note ? "<p>" + escapeHtml(s.note) + "</p>" : "");
    } else if (t) {
      html = '<span class="comp-kicker">' + chart.key + " · Transició " + t.from + " → " + t.to + "</span>" +
        "<h4>" + escapeHtml(t.fn) + "</h4>" +
        '<dl class="gf-levels-dl"><dt>Tecnològic</dt><dd>' + gfCondHtml(t.c, "tag") + "</dd><dt>PLC</dt><dd>" + gfCondHtml(t.c, "plc") + "</dd></dl>" +
        (t.note ? "<p>" + escapeHtml(t.note) + "</p>" : "");
    } else {
      html = '<p class="gf-hint">Passa el ratolí per sobre d\'una etapa o d\'una transició, toca-la o arriba-hi amb el tabulador per veure\'n l\'explicació.</p>';
    }
    box.innerHTML = html;
  }

  // Ressalta l'element del dibuix i els senyals que fa servir (o al revés, des de la taula).
  function gfHighlight(el, varId) {
    var svg = panel.querySelector(".gf-svg");
    if (!svg) return;
    Array.prototype.forEach.call(panel.querySelectorAll(".is-hot, .is-rel"), function (x) {
      x.classList.remove("is-hot", "is-rel");
    });
    if (el) {
      el.classList.add("is-hot");
      (el.getAttribute("data-vars") || "").split(" ").filter(Boolean).forEach(function (v) {
        var row = panel.querySelector('.gf-table tr[data-var="' + v + '"]');
        if (row) row.classList.add("is-rel");
      });
    } else if (varId) {
      Array.prototype.forEach.call(svg.querySelectorAll("[data-el]"), function (x) {
        if ((" " + x.getAttribute("data-vars") + " ").indexOf(" " + varId + " ") >= 0) x.classList.add("is-rel");
      });
      var r = panel.querySelector('.gf-table tr[data-var="' + varId + '"]');
      if (r) r.classList.add("is-hot");
    }
  }

  // Fixa (o deixa de fixar) un element. L'explicació que es mostra és la d'"info" si es dona.
  function gfSetPinned(id, info) {
    gfPinned = id;
    Array.prototype.forEach.call(panel.querySelectorAll(".gf-svg .is-pin"), function (x) {
      x.classList.remove("is-pin");
      x.setAttribute("aria-pressed", "false");
    });
    var el = id && panel.querySelector('.gf-svg [data-el="' + id + '"]');
    if (el) {
      el.classList.add("is-pin");
      el.setAttribute("aria-pressed", "true");
    }
    gfShowInfo(info === undefined ? id : info);
  }

  panel.addEventListener("click", function (e) {
    if (!gf || !e.target.closest) return;
    var t = e.target.closest(".gf-tab, .gf-level, .gf-zoom, [data-el]");
    if (!t || !panel.contains(t)) return;
    if (t.classList.contains("gf-tab")) {
      gfChart = +t.getAttribute("data-chart");
      gfPinned = "";
      drawGrafcet();
    } else if (t.classList.contains("gf-level")) {
      gfLevel = t.getAttribute("data-level");
      drawGrafcet();
    } else if (t.classList.contains("gf-zoom")) {
      openSheet("gf:" + gfChart, t);
    } else {
      var id = t.getAttribute("data-el");
      if (gfPinned === id) {
        // Es deixa de fixar, però se segueix veient l'explicació de l'element que es té a sota.
        gfSetPinned("", id);
      } else {
        gfSetPinned(id);
        gfRevealInfo();
      }
    }
  });
  // En una sola columna (mòbils) l'explicació queda sota el dibuix: si no es veu, s'hi porta.
  function gfRevealInfo() {
    var box = panel.querySelector(".gf-info");
    if (!box || !window.matchMedia || !window.matchMedia("(max-width: 1000px)").matches) return;
    measureVisible(function (vis) {
      var r = box.getBoundingClientRect();
      if (r.top < vis.top || r.bottom > vis.top + vis.height) scrollToEl(box, "nearest");
    });
  }

  panel.addEventListener("keydown", function (e) {
    if (!gf || (e.key !== "Enter" && e.key !== " ")) return;
    var t = e.target.closest && e.target.closest("[data-el]");
    if (!t) return;
    e.preventDefault();
    t.dispatchEvent(new MouseEvent("click", { bubbles: true }));
  });
  function gfHover(e) {
    if (!gf || !e.target.closest) return;
    var el = e.target.closest(".gf-svg [data-el]");
    var row = !el && e.target.closest(".gf-table tr[data-var]");
    if (el) {
      if (el.classList.contains("is-hot")) return;
      gfHighlight(el);
      gfShowInfo(el.getAttribute("data-el"));
    } else if (row && !row.classList.contains("is-hot")) {
      gfHighlight(null, row.getAttribute("data-var"));
    }
  }
  function gfLeave(e) {
    if (!gf || !e.target.closest) return;
    var from = e.target.closest(".gf-svg [data-el], .gf-table tr[data-var]");
    if (!from) return;
    var to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".gf-svg [data-el], .gf-table tr[data-var]");
    if (to === from) return;
    if (!to) { gfHighlight(null); gfShowInfo(gfPinned); }
  }
  panel.addEventListener("mouseover", gfHover);
  panel.addEventListener("mouseout", gfLeave);
  panel.addEventListener("focusin", gfHover);
  panel.addEventListener("focusout", gfLeave);

  // --- Grafcet ampliat (a la finestra de les fitxes) ---

  function gfSheetHtml(i) {
    var chart = gf.charts[i];
    return '<div class="sheet-gf"><div class="sheet-gf-head"><span class="comp-kicker">Grafcet · nivell ' +
      gfLevelName(gfLevel) + '</span><h3 id="sheet-title">' + chart.key + " · " + escapeHtml(chart.name) + "</h3></div>" +
      '<p class="gf-wide-hint">Llisca cap al costat per veure tot el grafcet.</p>' +
      '<div class="sheet-gf-chart" tabindex="0" role="region" aria-label="' + gfAttr("Grafcet " + chart.key + " ampliat") + '">' +
      gfSvg(chart, gfLevel, false).html + "</div></div>";
  }

  // Mida del grafcet ampliat: tan gran com hi càpiga a la part visible.
  function gfFitSheet(panelW, maxH) {
    var svg = sheetContent.querySelector(".sheet-gf-chart svg");
    if (!svg) return;
    var w = +svg.getAttribute("data-w"), h = +svg.getAttribute("data-h");
    var head = sheetContent.querySelector(".sheet-gf-head").offsetHeight;
    var nav = sheetPanel.querySelector(".sheet-nav").offsetHeight;
    var availW = panelW - 48, availH = maxH - nav - head - 60;
    var k = Math.min(availW / w, availH / h, 2);
    // No s'encongeix tant que no es pugui llegir: si no hi cap, es desplaça. Si ni tan sols hi cap
    // d'amplada (mòbils), es mostra a la mida real, com al panell.
    if (k < 0.8) k = availW / w < 0.8 ? 1 : 0.8;
    svg.setAttribute("width", Math.round(w * k));
    svg.setAttribute("height", Math.round(h * k));
    var box = svg.parentNode;
    box.parentNode.classList.toggle("is-wide", box.scrollWidth > box.clientWidth + 2);
  }

  function showStation(s) {
    pageTitle.textContent = s.title;
    breadcrumb.innerHTML = '<a href="#">Inici</a> &rsaquo; ' + escapeHtml(s.title);
    breadcrumb.hidden = false;
    setImage(stationImg, s.imageId, s.title);
    stationDesc.innerHTML = s.description.map(function (p) {
      return "<p>" + escapeHtml(p) + "</p>";
    }).join("");

    buttonsEl.innerHTML = "";
    clearPanel();
    BUTTONS.forEach(function (b) {
      var btn = document.createElement("button");
      btn.className = "btn";
      btn.type = "button";
      btn.textContent = b.label;
      btn.setAttribute("aria-expanded", "false");
      btn.addEventListener("click", function () {
        var wasActive = btn.classList.contains("active");
        Array.prototype.forEach.call(buttonsEl.children, function (c) {
          c.classList.remove("active");
          c.setAttribute("aria-expanded", "false");
        });
        if (wasActive) {
          panelWrap.classList.remove("open");
          return;
        }
        btn.classList.add("active");
        btn.setAttribute("aria-expanded", "true");
        var doc;
        if (panel.dataset.key === b.key) {
          doc = panel.querySelector(".doc");
          if (doc) sizeDoc(doc);
        } else {
          doc = renderSection(b.key, b.label, s.sections && s.sections[b.key]);
          if (panelWrap.classList.contains("open")) {
            panel.classList.remove("swap");
            void panel.offsetWidth;
            panel.classList.add("swap");
          }
        }
        panelWrap.classList.add("open");
        var comp = panel.querySelector(".comp, .gf");
        setTimeout(function () {
          if (!panelWrap.classList.contains("open")) return;
          if (doc && panel.contains(doc)) {
            // Un document és alt: el portem sencer a la vista.
            scrollToEl(doc, "nearest");
          } else if (comp && panel.contains(comp)) {
            // Si el catàleg ha quedat massa avall, pugem els botons a dalt de tot.
            measureVisible(function (vis) {
              if (panel.getBoundingClientRect().top > vis.top + vis.height * 0.6) scrollToEl(buttonsEl, "start");
            });
          }
        }, REDUCED_MOTION ? 60 : 420);
      });
      buttonsEl.appendChild(btn);
    });

    videoSetStation(s);

    home.classList.add("hidden");
    station.classList.remove("hidden");
    restartAnimation(station);
  }

  function route() {
    var slug = location.hash.replace("#", "");
    var s = STATIONS.filter(function (x) { return x.slug === slug; })[0];
    videoReset();
    closeSheet(true);
    if (s) showStation(s); else showHome();
    restartAnimation(hero);
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------------------
  // Vídeo: es reprodueix en passar per sobre de la imatge i s'amplia sol
  // ---------------------------------------------------------------------------

  var media = $("media");
  var mediaVideo = $("media-video");
  var player = $("player");
  var stage = $("player-stage");
  var slot = $("player-video");
  var playerTitle = $("player-title");
  var playBtn = $("player-play");
  var range = $("player-range");
  var curEl = $("player-current");
  var totEl = $("player-total");
  var fsBtn = $("player-fs");
  var closeBtn = $("player-close");
  var sentinel = $("viewport-sentinel");
  var root = document.documentElement;

  media.style.setProperty("--preview-ms", PREVIEW_MS + "ms");

  var video = document.createElement("video");
  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.setAttribute("muted", "");
  video.setAttribute("playsinline", "");
  video.preload = "auto";
  mediaVideo.appendChild(video);

  var iframe = null;           // reproductor de Google Drive (alternativa)
  var current = null;          // estació actual
  var state = "idle";          // idle | loading | preview | expanded
  var fallback = false;        // el navegador no pot reproduir el fitxer directament
  var hovering = false;
  var cooldown = false;        // no tornar a començar fins que el ratolí surti de la imatge
  var navHold = false;         // després de canviar de pantalla, esperar un moviment real del ratolí
  var closing = false;
  var loadTimedOut = false;    // el vídeo no ha arribat a temps (encara pot arribar més tard)
  var closedAt = -1e9;
  var previewTimer = null;
  var resetTimer = null;
  var loadTimer = null;
  var pollTimer = null;
  var rafId = 0;
  var openToken = 0;
  var scrubbing = false;
  var lastVisible = null;
  var fullscreenSupported = !!(document.fullscreenEnabled && stage.requestFullscreen);
  if (!fullscreenSupported) fsBtn.classList.add("hidden");

  function noop() {}

  function videoAspect() {
    return video.videoWidth && video.videoHeight ? video.videoWidth / video.videoHeight : 16 / 9;
  }

  function videoSetStation(s) {
    current = s;
    fallback = false;
    loadTimedOut = false;
    clearTimeout(loadTimer);
    loadTimer = null;
    media.classList.remove("is-hint");
    playerTitle.textContent = s.title;
    video.src = driveVideo(s.videoId);
    video.load();
  }

  function clearTimers() {
    clearTimeout(previewTimer);
    clearTimeout(resetTimer);
    previewTimer = resetTimer = null;
  }

  function cancelSlotAnims() {
    if (slot.getAnimations) slot.getAnimations().forEach(function (a) { a.cancel(); });
  }

  function playVideo() {
    var p = video.play();
    if (p && p.catch) {
      p.catch(function (err) {
        // El navegador no deixa començar el vídeo sol: cal un clic.
        if (err && err.name === "NotAllowedError" && state !== "expanded") {
          clearTimeout(loadTimer);
          loadTimer = null;
          stopPreview();
          if (hovering) media.classList.add("is-hint");
        }
      });
    }
  }

  // Un sol termini per estació: si el vídeo no arriba a temps, es fa servir el reproductor de Drive.
  function armLoadTimeout() {
    if (loadTimer || fallback || loadTimedOut) return;
    loadTimer = setTimeout(function () {
      loadTimer = null;
      if (video.readyState >= 3) return;
      loadTimedOut = true;
      if (state === "loading" || state === "expanded") enterFallback();
    }, LOAD_TIMEOUT_MS);
  }
  function checkLoadTimedOut() {
    if (loadTimedOut && !fallback && video.readyState < 3) enterFallback();
  }

  function enterFallback() {
    if (fallback || !current) return;
    fallback = true;
    clearTimeout(loadTimer);
    loadTimer = null;
    if (state === "loading" || state === "preview") {
      stopPreview();
      if (hovering) media.classList.add("is-hint");
    } else if (state === "expanded") {
      useIframe();
    }
  }

  video.addEventListener("error", function () {
    if (video.getAttribute("src")) enterFallback();
  });
  video.addEventListener("loadedmetadata", function () {
    if (!video.videoWidth) enterFallback();
  });
  video.addEventListener("playing", function () {
    clearTimeout(loadTimer);
    loadTimer = null;
    media.classList.remove("is-loading");
    player.classList.remove("is-buffering");
    if (state === "loading") {
      state = "preview";
      media.classList.add("is-playing");
      void media.offsetWidth;
      media.classList.add("is-counting");
      previewTimer = setTimeout(expand, PREVIEW_MS);
    }
  });
  video.addEventListener("waiting", function () {
    if (state === "expanded") player.classList.add("is-buffering");
  });
  ["pause", "canplay", "ended", "seeked"].forEach(function (ev) {
    video.addEventListener(ev, function () { player.classList.remove("is-buffering"); });
  });
  video.addEventListener("canplay", function () {
    loadTimedOut = false;
    if (fallback && state !== "expanded" && video.videoWidth && !video.error) {
      fallback = false;
      media.classList.remove("is-hint");
    }
  });
  video.addEventListener("play", syncPlayState);
  video.addEventListener("pause", syncPlayState);
  video.addEventListener("ended", syncPlayState);
  video.addEventListener("seeked", syncPlayState);
  video.addEventListener("loadedmetadata", syncTime);
  video.addEventListener("seeked", syncTime);

  // --- Vista prèvia sobre la imatge ---

  function startPreview() {
    if (state !== "idle" || cooldown) return;
    checkLoadTimedOut();
    if (fallback) { media.classList.add("is-hint"); return; }
    clearTimers();
    state = "loading";
    media.classList.add("is-loading");
    if (video.parentNode !== mediaVideo) mediaVideo.appendChild(video);
    try { video.currentTime = 0; } catch (e) {}
    playVideo();
    armLoadTimeout();
  }

  function stopPreview() {
    if (state !== "loading" && state !== "preview") return;
    clearTimers();
    state = "idle";
    media.classList.remove("is-loading", "is-playing", "is-counting");
    resetTimer = setTimeout(function () {
      if (state === "idle") {
        video.pause();
        try { video.currentTime = 0; } catch (e) {}
      }
    }, 450);
  }

  media.addEventListener("pointerenter", function (e) {
    if (e.pointerType === "touch") return;
    hovering = true;
    // Just després de tancar el reproductor o de canviar de pantalla el ratolí pot quedar
    // sobre la imatge sense que l'usuari l'hi hagi posat: esperem que es mogui o en surti.
    if (navHold || performance.now() - closedAt < 800) {
      cooldown = true;
      return;
    }
    startPreview();
  });
  media.addEventListener("pointermove", function (e) {
    if (e.pointerType === "touch" || !navHold) return;
    navHold = false;
    if (performance.now() - closedAt >= 800) {
      cooldown = false;
      startPreview();
    }
  });
  media.addEventListener("pointerleave", function (e) {
    if (e.pointerType === "touch") return;
    hovering = false;
    cooldown = false;
    navHold = false;
    media.classList.remove("is-hint");
    stopPreview();
  });
  media.addEventListener("click", function () {
    if (state === "expanded") return;
    checkLoadTimedOut();
    if (!fallback && state === "idle") {
      clearTimers();
      if (video.parentNode !== mediaVideo) mediaVideo.appendChild(video);
      try { video.currentTime = 0; } catch (e) {}
      playVideo();
      armLoadTimeout();
    }
    expand();
  });
  media.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      e.stopPropagation();
      media.click();
    }
  });

  // --- Part visible de la pàgina ---
  // Dins de Google Sites la web va dins d'un marc (iframe) que pot ser més alt que la
  // pantalla. IntersectionObserver ens diu quina part del marc es veu realment.

  function measureVisible(cb) {
    var w = window.innerWidth, h = window.innerHeight;
    var full = { left: 0, top: 0, width: w, height: h };
    if (!("IntersectionObserver" in window)) { cb(full); return; }
    var done = false;
    var io = new IntersectionObserver(function (entries) {
      if (done) return;
      done = true;
      io.disconnect();
      var r = entries[entries.length - 1].intersectionRect;
      var left = Math.max(0, r.left), top = Math.max(0, r.top);
      var right = Math.min(w, r.left + r.width), bottom = Math.min(h, r.top + r.height);
      if (right - left < 1 || bottom - top < 1) cb(full);
      else cb({ left: left, top: top, width: right - left, height: bottom - top });
    });
    io.observe(sentinel);
    setTimeout(function () {
      if (!done) { done = true; io.disconnect(); cb(full); }
    }, 300);
  }

  // Després de desplaçar la pàgina de Google Sites, esperem que la posició s'estabilitzi.
  function measureStable(cb) {
    var t0 = performance.now(), prev = null;
    (function step() {
      measureVisible(function (v) {
        var stable = prev && Math.abs(v.top - prev.top) < 2 && Math.abs(v.height - prev.height) < 2;
        if (stable || performance.now() - t0 > 600) cb(v);
        else { prev = v; step(); }
      });
    })();
  }

  function layoutStage(vis) {
    if (document.fullscreenElement) return;
    lastVisible = vis;
    var margin = vis.width < 600 ? 8 : 32;
    // Si el marc queda tallat per dalt, la barra fixa de Google Sites pot tapar-ne una part.
    var topInset = vis.top > 0 ? 64 : 0;
    var head = 52, controls = 56;
    var aspect = fallback ? 16 / 9 : videoAspect();
    var availW = vis.width - margin * 2;
    var availH = vis.height - topInset - margin * 2 - head - controls;
    var w = Math.min(availW, Math.max(availH, 120) * aspect, 1280);
    var h = w / aspect;
    var total = head + h + controls;
    var areaTop = vis.top + topInset, areaH = vis.height - topInset;
    var top = Math.max(areaTop + 4, areaTop + (areaH - total) / 2);
    top = Math.max(4, Math.min(top, window.innerHeight - total - 4));
    stage.style.width = w + "px";
    stage.style.left = vis.left + (vis.width - w) / 2 + "px";
    stage.style.top = top + "px";
    slot.style.height = h + "px";
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      measureVisible(function (vis) {
        if (state !== "expanded" || !lastVisible) return;
        // Si el visitant fa desaparèixer gairebé tot el marc, mantenim la mida que tenia.
        if (vis.height < 200 && vis.height < window.innerHeight - 2) return;
        if (Math.abs(vis.top - lastVisible.top) > 4 || Math.abs(vis.height - lastVisible.height) > 4 ||
            Math.abs(vis.left - lastVisible.left) > 4 || Math.abs(vis.width - lastVisible.width) > 4) {
          layoutStage(vis);
        }
      });
    }, 100);
  }
  function stopPolling() {
    clearInterval(pollTimer);
    pollTimer = null;
  }

  // Bloqueja el desplaçament sense que la pàgina salti quan desapareix la barra de desplaçament.
  function lockScroll() {
    if (root.classList.contains("player-open")) return;
    var sbw = window.innerWidth - root.clientWidth;
    root.style.paddingRight = sbw > 0 ? sbw + "px" : "";
    root.classList.add("player-open");
  }
  function unlockScroll() {
    root.classList.remove("player-open");
    root.style.paddingRight = "";
  }

  function focusQuietly(el) {
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  }

  // --- Reproductor ampliat ---

  function useIframe() {
    player.classList.add("is-fallback");
    player.classList.remove("is-buffering");
    video.pause();
    if (video.parentNode === slot) mediaVideo.appendChild(video);
    if (!iframe) {
      iframe = document.createElement("iframe");
      // Només demanem els permisos que aquesta pàgina té (evita avisos a la consola).
      var fp = document.permissionsPolicy || document.featurePolicy;
      var allow = ["autoplay", "fullscreen"].filter(function (f) {
        return !fp || !fp.allowsFeature || fp.allowsFeature(f);
      });
      if (allow.length) iframe.setAttribute("allow", allow.join("; "));
      if (allow.indexOf("fullscreen") >= 0) iframe.setAttribute("allowfullscreen", "");
      iframe.title = "Vídeo";
    }
    var src = drivePreview(current.videoId);
    if (iframe.getAttribute("src") !== src) iframe.src = src;
    if (iframe.parentNode !== slot) slot.appendChild(iframe);
    if (stage.contains(document.activeElement) && document.activeElement !== closeBtn) focusQuietly(closeBtn);
    if (lastVisible) layoutStage(lastVisible);
  }

  function expand() {
    if (state === "expanded" || !current) return;
    cancelSlotAnims();
    closing = false;
    navHold = false;
    clearTimeout(previewTimer);
    clearTimeout(resetTimer);
    var aspect = fallback ? 16 / 9 : videoAspect();
    var from = containRect(mediaVideo.getBoundingClientRect(), aspect);
    state = "expanded";
    media.classList.remove("is-loading", "is-playing", "is-counting", "is-hint");
    var token = ++openToken;

    // El reproductor es prepara invisible i es mostra quan ja té la mida i la posició.
    player.hidden = false;
    stage.style.opacity = "0";
    player.classList.remove("is-open", "is-settled", "is-ended");
    lockScroll();
    if (fallback) {
      useIframe();
    } else {
      player.classList.remove("is-fallback");
      if (video.readyState < 3) player.classList.add("is-buffering");
      if (video.paused) playVideo();
    }
    syncPlayState();
    syncTime();

    measureVisible(function open(vis, retried) {
      if (token !== openToken) return;
      // Si del marc de Google Sites només se'n veu una franja massa petita, el portem a la vista.
      if (!retried && vis.height < Math.min(window.innerHeight - 2, 360)) {
        try { media.scrollIntoView({ block: "center" }); } catch (e) {}
        measureStable(function (v2) {
          from = containRect(mediaVideo.getBoundingClientRect(), aspect);
          open(v2, true);
        });
        return;
      }
      if (!fallback && video.parentNode !== slot) slot.appendChild(video);
      layoutStage(vis);
      var to = slot.getBoundingClientRect();
      stage.style.opacity = "";
      void player.offsetWidth;
      player.classList.add("is-open");
      if (slot.animate && to.width > 0) {
        var s = from.width / to.width;
        slot.animate([
          { transform: "translate(" + (from.left - to.left) + "px," + (from.top - to.top) + "px) scale(" + s + ")" },
          { transform: "none" }
        ], { duration: REDUCED_MOTION ? 1 : 560, easing: "cubic-bezier(0.22, 0.8, 0.24, 1)" });
      }
      setTimeout(function () {
        if (token === openToken) player.classList.add("is-settled");
      }, 600);
      focusQuietly(fallback ? closeBtn : playBtn);
      startPolling();
      startRaf();
    });
  }

  function finishClose() {
    closing = false;
    cancelSlotAnims();
    stopPolling();
    stopRaf();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(noop);
    player.hidden = true;
    stage.style.opacity = "";
    player.classList.remove("is-open", "is-settled", "is-buffering", "is-fallback", "is-fullscreen");
    unlockScroll();
    if (iframe && iframe.parentNode) {
      iframe.parentNode.removeChild(iframe);
      iframe.removeAttribute("src");
    }
    state = "idle";
    closedAt = performance.now();
  }

  function close() {
    if (state !== "expanded" || closing) return;
    closing = true;
    var token = ++openToken;
    stopPolling();
    stopRaf();
    var wasFullscreen = !!document.fullscreenElement;
    if (wasFullscreen && document.exitFullscreen) document.exitFullscreen().catch(noop);
    var withVideo = video.parentNode === slot;
    // Si encara s'estava obrint, el tancament continua des d'on era.
    var cur = getComputedStyle(slot).transform;
    cancelSlotAnims();
    var last = slot.getBoundingClientRect();
    var to = containRect(mediaVideo.getBoundingClientRect(), fallback ? 16 / 9 : videoAspect());
    player.classList.remove("is-open", "is-settled");
    var done = false;
    var anim = null;
    function finish() {
      if (done || token !== openToken) return;
      done = true;
      if (!withVideo && !fallback) {
        // Tancat abans que el vídeo arribés al reproductor.
        video.pause();
        try { video.currentTime = 0; } catch (e) {}
      }
      if (withVideo) {
        // El vídeo torna al seu lloc i es fon amb la foto.
        mediaVideo.appendChild(video);
        if (mediaVideo.animate) {
          mediaVideo.animate([{ opacity: 1 }, { opacity: 0 }], { duration: REDUCED_MOTION ? 1 : 450, easing: "ease" });
        }
        resetTimer = setTimeout(function () {
          if (state === "idle") {
            video.pause();
            try { video.currentTime = 0; } catch (e) {}
          }
        }, 500);
      }
      finishClose();
      cooldown = hovering;
      focusQuietly(media);
    }
    if (slot.animate && last.width > 0 && !wasFullscreen) {
      var s = to.width / last.width;
      var target = "translate(" + (to.left - last.left) + "px," + (to.top - last.top) + "px) scale(" + s + ")";
      // Amb el reproductor de Drive no hi ha vídeo per fondre amb la foto: el requadre s'esvaeix en arribar.
      var frames = withVideo
        ? [{ transform: cur && cur !== "none" ? cur : "none" }, { transform: target }]
        : [{ transform: cur && cur !== "none" ? cur : "none", opacity: 1 }, { opacity: 1, offset: 0.6 }, { transform: target, opacity: 0 }];
      anim = slot.animate(frames, { duration: REDUCED_MOTION ? 1 : 460, easing: "cubic-bezier(0.4, 0, 0.2, 1)", fill: "forwards" });
      anim.onfinish = finish;
    } else if (slot.animate) {
      anim = slot.animate([{ opacity: 1 }, { opacity: 0 }], { duration: REDUCED_MOTION ? 1 : 300, fill: "forwards" });
      anim.onfinish = finish;
    }
    setTimeout(finish, REDUCED_MOTION ? 20 : 520);
  }

  // Atura-ho tot de cop (canvi de pantalla).
  function videoReset() {
    ++openToken;
    clearTimers();
    media.classList.remove("is-loading", "is-playing", "is-counting", "is-hint");
    if (state === "expanded") finishClose();
    closing = false;
    cancelSlotAnims();
    if (video.parentNode !== mediaVideo) mediaVideo.appendChild(video);
    video.pause();
    state = "idle";
    cooldown = false;
    navHold = true;
  }

  function togglePlay() {
    if (fallback) return;
    if (video.ended) {
      try { video.currentTime = 0; } catch (e) {}
    }
    if (video.paused || video.ended) playVideo(); else video.pause();
  }

  function syncPlayState() {
    var playing = !video.paused && !video.ended;
    player.classList.toggle("is-playing", playing);
    player.classList.toggle("is-ended", video.ended);
    playBtn.setAttribute("aria-label", playing ? "Pausar" : (video.ended ? "Tornar a veure" : "Reproduir"));
  }

  function syncTime() {
    var d = isFinite(video.duration) ? video.duration : 0;
    var t = video.currentTime || 0;
    if (+range.max !== d) range.max = d;
    if (!scrubbing) range.value = t;
    var p = d ? Math.min(100, (t / d) * 100) : 0;
    range.style.setProperty("--p", p + "%");
    curEl.textContent = formatTime(t);
    totEl.textContent = formatTime(d);
  }

  function startRaf() {
    stopRaf();
    (function tick() {
      syncTime();
      rafId = requestAnimationFrame(tick);
    })();
  }
  function stopRaf() {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }

  // Els clics mentre el reproductor s'obre (p. ex. el segon clic d'un doble clic) no compten.
  function settled() {
    return player.classList.contains("is-settled");
  }

  playBtn.addEventListener("click", togglePlay);
  slot.addEventListener("click", function (e) {
    if (settled() && e.target === video) togglePlay();
  });
  closeBtn.addEventListener("click", close);
  $("player-backdrop").addEventListener("click", function (e) {
    if (settled() && e.detail <= 1) close();
  });
  $("player-guard").addEventListener("focus", function () { focusQuietly(closeBtn); });

  range.addEventListener("pointerdown", function () { scrubbing = true; });
  range.addEventListener("input", function () {
    var t = +range.value;
    if (isFinite(t)) {
      try { video.currentTime = t; } catch (e) {}
      if (video.ended || t < (video.duration || 0)) player.classList.remove("is-ended");
    }
    syncTime();
  });
  range.addEventListener("change", function () { scrubbing = false; });
  window.addEventListener("pointerup", function () { scrubbing = false; });

  fsBtn.addEventListener("click", function () {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(noop);
    } else {
      stage.requestFullscreen().catch(noop);
    }
  });
  document.addEventListener("fullscreenchange", function () {
    var fs = document.fullscreenElement === stage;
    player.classList.toggle("is-fullscreen", fs);
    if (!fs && state === "expanded" && !closing) measureVisible(layoutStage);
  });

  document.addEventListener("keydown", function (e) {
    if (state !== "expanded" || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (e.key === "Escape") {
      e.preventDefault();
      close();
    } else if (e.key === "k" || (e.key === " " && tag !== "BUTTON")) {
      if (fallback) return;
      e.preventDefault();
      togglePlay();
    } else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !fallback) {
      e.preventDefault();
      var d = e.key === "ArrowLeft" ? -5 : 5;
      try { video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + d)); } catch (err) {}
    } else if (e.key === "Tab") {
      // Mantenir el focus dins del reproductor.
      var items = Array.prototype.filter.call(stage.querySelectorAll("button, input, iframe"), function (el) {
        return el.offsetParent !== null && !el.classList.contains("hidden") &&
          getComputedStyle(el).visibility !== "hidden";
      });
      if (!items.length) return;
      var first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  window.addEventListener("resize", function () {
    if (state === "expanded" && !closing) measureVisible(layoutStage);
  });

  // ---------------------------------------------------------------------------

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
